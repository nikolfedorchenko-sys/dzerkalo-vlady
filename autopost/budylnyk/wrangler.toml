# Cloudflare Worker «будильник» для автопостингу. Розгортання: npx wrangler deploy (з цієї папки).
name = "dv-autopost-budylnyk"
main = "index.js"
compatibility_date = "2025-09-01"
workers_dev = false

[triggers]
crons = ["2 5-19 * * *"]   # щогодини в UTC; покриває 08–21 за Києвом і влітку, і взимку

[vars]
REPO = "nikolfedorchenko-sys/dzerkalo-vlady"
