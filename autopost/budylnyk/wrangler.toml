# Cloudflare Worker «будильник» для автопостингу. Розгортається сам через GitHub Actions
# (.github/workflows/budylnyk.yml) після кожної зміни в цій папці.
# Секрети Worker: GH_TOKEN, NEWS_BOT_TOKEN, AUTOPOST_BOT_TOKEN (останній ставить той самий робочий процес).
name = "dv-autopost-budylnyk"
main = "index.js"
account_id = "07983bbf698c3bfbf893b410c40e4e70"   # акаунт Cloudflare (не секрет)
compatibility_date = "2025-09-01"
workers_dev = true   # адреса для бота «Надіслати новину»

[triggers]
# Автопостинг зупинено 22.10.2026 – будильник нікого не будить. Увімкнути: crons = ["2 4-20 * * *"]
crons = []

[vars]
REPO = "nikolfedorchenko-sys/dzerkalo-vlady"
ADMIN_CHAT = "422470697"   # куди бот «Надіслати новину» пересилає повідомлення читачів

# Схвалені власником чернетки (кнопка «Опублікувати»), зберігаються добу
[[kv_namespaces]]
binding = "APPROVALS"
id = "d196d288c4624686ab6d0f7d9dd21bf2"
