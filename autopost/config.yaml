# Налаштування автопостингу «Дзеркало влади».
# Додати джерело: скопіюйте рядок і змініть назву та адресу.
#   RSS:      - { name: "Назва", url: "https://…/rss", kind: media }
#   Telegram: - { name: "Назва", channel: "імʼя_каналу_без_@", kind: official }
# kind: official – органи влади (першоджерело), media – медіа.

limits:
  window_hours: 12          # брати матеріали не старші за стільки годин
  max_items_for_triage: 120 # скільки свіжих матеріалів за раз показувати Claude
  min_importance: 7         # публікуємо сюжети з оцінкою від 7 з 10
  max_posts_per_run: 2      # не більше постів за один запуск (щогодини)
  max_posts_per_day: 10     # не більше постів за добу
  urgent_hours: 6           # через скільки годин знімати «Терміново» на сайті

# Посилання «Надіслати новину» в підписі Telegram-поста
submit_url: "https://t.me/dzerkalo_vlady"

