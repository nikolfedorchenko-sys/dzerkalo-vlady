# Налаштування автопостингу «Дзеркало влади».
# Додати джерело: скопіюйте рядок і змініть назву та адресу.
#   RSS:      - { name: "Назва", url: "https://…/rss", kind: media }
#   Telegram: - { name: "Назва", channel: "імʼя_каналу_без_@", kind: official }
# kind: official – органи влади (першоджерело), media – медіа.

# Години публікації за Києвом (у лапках, через пробіл). Робот працює тільки в ці години.
slots: "08 10 12 14 17 19 21"

limits:
  window_hours: 12          # брати матеріали не старші за стільки годин
  max_items_for_triage: 80  # скільки свіжих матеріалів за раз показувати Claude
  min_importance: 5         # публікуємо сюжети з оцінкою від 5 з 10
  max_posts_per_run: 2      # не більше постів за один запуск
  max_posts_per_day: 8      # не більше постів за добу (з 00:00 за Києвом)
  bypass_importance: 9      # сюжети з такою оцінкою і «Терміново» виходять навіть понад денний ліміт
  urgent_hours: 6           # через скільки годин знімати «Терміново» на сайті

# Матеріали з цими словами в заголовку чи описі відкидаються ще до Claude – так менше витрачається ліміт.
# Пишіть частину слова малими літерами: «футбол» відсіє і «футболу», і «футболіст».
skip_words:
  - футбол
  - баскетбол
  - теніс
  - олімпі
  - чемпіонат
  - матч
  - гороскоп
  - прогноз погоди
  - синоптик
  - курс долара
  - курс валют
  - на правах реклами
  - зірка шоу
  - серіал
  - кінопрем

# Посилання «Надіслати новину» в підписі Telegram-поста
submit_url: "https://t.me/dzerkalo_vlady"

