# Автопостинг «Дзеркало влади».
# Години публікації – у autopost/config.yaml (рядок slots). Cloudflare будить робота щогодини,
# але працює він тільки в ці години; решту разів лише перевіряє час (кілька секунд, без Claude).
# Секрети й режим задаються в GitHub: Settings → Secrets and variables → Actions (див. autopost/README.md).
name: Автопостинг

on:
  # Будить робота Cloudflare (autopost/budylnyk) щогодини з дією «За розкладом»;
  # вбудований розклад GitHub не використовуємо – він ненадійно спрацьовує.
  workflow_dispatch:          # кнопка «Run workflow» – запустити вручну (працює в будь-який час)
    inputs:
      action:
        description: "Що зробити"
        type: choice
        default: "Звичайний запуск"
        options:
          - "Звичайний запуск"
          - "Перевірити Facebook"
          - "За розкладом"
          - "Опублікувати чернетку"
          - "Видалити пост з Telegram"
          - "Тест кнопок"
          - "Перевірити фото"
          - "Тест відправки"
      drafts:
        description: "Чернетки для публікації (ставить бот, коли ви тиснете «Опублікувати»)"
        type: string
        default: ""
      post:
        description: "Для «Видалити пост з Telegram»: посилання на пост, напр. https://t.me/dzerkalo_vlady/27"
        type: string
        default: ""

permissions:
  contents: write             # щоб додавати новини в site/data/news.json

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.slot.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: autopost/config.yaml
          sparse-checkout-cone-mode: false
      - id: slot
        name: Чи зараз година публікації
        run: |
          H=$(TZ=Europe/Kyiv date +%H)
          SLOTS=$(grep -E '^slots:' autopost/config.yaml | cut -d'"' -f2)
          if [ "${{ inputs.action }}" != "За розкладом" ] || echo " $SLOTS " | grep -q " $H "; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "Зараз $H:00 за Києвом – працюємо"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Зараз $H:00 за Києвом – не година публікації ($SLOTS)"
          fi

  run:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:              # запуски йдуть по одному (спільна памʼять); «Відправка» нижче їх не тримає
      group: autopost
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autopost/requirements.txt

      - run: pip install -r autopost/requirements.txt

      # Claude Code – через нього робот працює на підписці Claude Max
      - run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      # Памʼять між запусками: які матеріали вже бачили і що вже опублікували
      - uses: actions/cache/restore@v4
        with:
          path: autopost/state
          key: autopost-state-v3-${{ github.run_id }}
          restore-keys: autopost-state-v3-

      - name: Запуск
        env:
          DV_MODE: ${{ vars.DV_MODE || 'test' }}
          DV_ACTION: ${{ inputs.action == 'Перевірити Facebook' && 'facebook-check' || inputs.action == 'Опублікувати чернетку' && 'publish-draft' || inputs.action == 'Видалити пост з Telegram' && 'delete-post' || inputs.action == 'Тест кнопок' && 'test-buttons' || inputs.action == 'Перевірити фото' && 'test-photos' || inputs.action == 'Тест відправки' && 'test-outbox' || '' }}
          DV_DRAFTS: ${{ inputs.drafts }}
          DV_POST: ${{ inputs.post }}
          DV_MODEL: ${{ vars.DV_MODEL }}             # модель для текстів (за замовчуванням Opus)
          DV_MODEL_FAST: ${{ vars.DV_MODEL_FAST }}   # модель для відбору й перевірки (за замовчуванням Sonnet)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # підписка Max
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}               # запасний варіант: платний API
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ vars.TG_CHANNEL_ID }}
          TG_TEST_CHANNEL_ID: ${{ vars.TG_TEST_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          git config user.name "dv-autopost"
          git config user.email "dv-autopost@users.noreply.github.com"
          python autopost/run.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: autopost/state
          key: autopost-state-v3-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: outbox
          path: autopost/outbox/
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards
          path: autopost/out/
          retention-days: 7
          if-no-files-found: ignore

  # Відправка: пости, яким ще не час (Telegram без спаму – з інтервалом 10–20 хв), надсилаються тут у свій час.
  # Цей крок чекає до години, але наступні запуски й кнопки «Опублікувати» на нього не чекають.
  outbox:
    needs: run
    if: needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: autopost
      - id: dl
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: outbox
          path: autopost/outbox
      - uses: actions/setup-python@v5
        if: steps.dl.outcome == 'success'
        with:
          python-version: "3.12"
      - name: Відправка в Telegram
        if: steps.dl.outcome == 'success'
        env:
          DV_MODE: ${{ vars.DV_MODE || 'test' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ vars.TG_CHANNEL_ID }}
          TG_TEST_CHANNEL_ID: ${{ vars.TG_TEST_CHANNEL_ID }}
          TG_ADMIN_CHAT_ID: ${{ vars.TG_ADMIN_CHAT_ID }}
        run: |
          pip install requests
          python autopost/outbox.py
