# Стан будильника (Cloudflare Worker): які боти підключені, коли востаннє запускалася черга Telegram.
# Нічого не змінює. «Слухати журнал» – показує живий журнал будильника протягом 30 хвилин (для діагностики).
name: Будильник – стан

on:
  workflow_dispatch:
    inputs:
      tail:
        description: "Слухати журнал будильника 30 хвилин"
        type: boolean
        default: false
      fix_schedule:
        description: "Записати розклад будильника напряму в Cloudflare"
        type: boolean
        default: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: inputs.tail
      - name: Журнал будильника
        if: inputs.tail
        working-directory: autopost/budylnyk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: timeout 1800 npx --yes wrangler@4 tail --format pretty || true
      - name: Розклад у Cloudflare (і виправлення, якщо він не збігається з wrangler.toml)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/07983bbf698c3bfbf893b410c40e4e70/workers/scripts/dv-autopost-budylnyk/schedules"
          echo "Зараз у Cloudflare:"; curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API"; echo
          if [ "${{ inputs.fix_schedule }}" = "true" ]; then
            echo "Записую розклад: порожній (автопостинг зупинено)"
            curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data '[]' "$API"; echo
          fi
      - run: curl -sS https://dv-autopost-budylnyk.nikolfedorchenko.workers.dev/status
